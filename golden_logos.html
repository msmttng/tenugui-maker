<script>
const PHI = (1 + Math.sqrt(5)) / 2; // 1.6180339887...

// 矩形やポリゴンを細分化して「波・揺れ（Sinusoidal Wave Warp）」を変形適用可能な汎用ヘルパー
function makeWarpedRectBuilder(x0, y0, w, h, warpFn){
  const mapPt = (u, v) => {
    const px = x0 + u * w;
    const py = y0 + v * h;
    if(!warpFn) return [px, py];
    return warpFn(px, py, u, v);
  };
  const poly = (ptsUV, segs = 10) => {
    const out = [];
    for(let i = 0; i < ptsUV.length; i++){
      const a = ptsUV[i], b = ptsUV[(i + 1) % ptsUV.length];
      for(let s = 0; s < segs; s++){
        const t = s / segs;
        out.push(mapPt(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t));
      }
    }
    return 'M' + out.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('L') + 'Z';
  };
  const rect = (u0, v0, uw, vh, segs = 10) => poly([[u0, v0], [u0 + uw, v0], [u0 + uw, v0 + vh], [u0, v0 + vh]], segs);
  return { poly, rect };
}

function glyphNakaPath(x0, y0, w, h, warpFn){
  const { poly, rect } = makeWarpedRectBuilder(x0, y0, w, h, warpFn);
  const s = 0.162, cx0 = 0.34, cx1 = 1.00, cy0 = 0.18, cy1 = 0.76, cs = 0.145, midX = (cx0 + cx1) * 0.5 - s * 0.5;
  let d = poly([[0.08,0.0],[0.26,0.0],[0.26,0.28],[0.23,0.32],[0.23,1.0],[0.07,1.0],[0.07,0.36],[0.0,0.36],[0.0,0.20],[0.08,0.12]], warpFn ? 8 : 1);
  d += rect(cx0, cy0, cx1 - cx0, cs, warpFn ? 8 : 1);
  d += rect(cx0, cy1 - cs, cx1 - cx0, cs, warpFn ? 8 : 1);
  d += rect(cx0, cy0, cs, cy1 - cy0, warpFn ? 8 : 1);
  d += rect(cx1 - cs, cy0, cs, cy1 - cy0, warpFn ? 8 : 1);
  d += rect(midX, 0.0, s, 1.0, warpFn ? 10 : 1);
  return d;
}

function glyphHanePath(x0, y0, w, h, warpFn){
  const { poly, rect } = makeWarpedRectBuilder(x0, y0, w, h, warpFn);
  const s = 0.158, wWing = 0.462;
  let d = '';
  for(const off of [0.0, 0.538]){
    d += poly([[off + 0.06, 0.0], [off + wWing, 0.0], [off + wWing, s], [off, s], [off, 0.06]], warpFn ? 6 : 1);
    d += poly([[off + wWing - s, 0.0], [off + wWing, 0.0], [off + wWing, 1.0], [off + 0.12, 1.0], [off + 0.06, 1.0 - s], [off + wWing - s, 1.0 - s]], warpFn ? 8 : 1);
    d += rect(off + 0.02, 0.34, wWing - s - 0.06, s * 0.85, warpFn ? 6 : 1);
    d += rect(off + 0.02, 0.60, wWing - s - 0.06, s * 0.85, warpFn ? 6 : 1);
  }
  return d;
}

function glyphTaPath(x0, y0, w, h, warpFn){
  const { rect } = makeWarpedRectBuilder(x0, y0, w, h, warpFn);
  const s = 0.184, m = 0.5 - s * 0.5;
  let d = '';
  d += rect(0, 0, 1, s, warpFn ? 8 : 1);
  d += rect(0, 1 - s, 1, s, warpFn ? 8 : 1);
  d += rect(0, 0, s, 1, warpFn ? 8 : 1);
  d += rect(1 - s, 0, s, 1, warpFn ? 8 : 1);
  d += rect(m, 0, s, 1, warpFn ? 8 : 1);
  d += rect(0, m, 1, s, warpFn ? 8 : 1);
  return d;
}

// 🌊 水平方向の黄金サイン波リボン（両端テーパー対応）
function waveRibbonH(x0, x1, yMid, amp, cycles, phaseRad, thStart, thMid, thEnd, steps = 48){
  const topPts = [], botPts = [];
  for(let i = 0; i <= steps; i++){
    const t = i / steps;
    const x = x0 + (x1 - x0) * t;
    const ang = t * cycles * Math.PI * 2 + phaseRad;
    const y = yMid + amp * Math.sin(ang);
    const th = (t < 0.5)
      ? (thStart + (thMid - thStart) * (t * 2))
      : (thMid + (thEnd - thMid) * ((t - 0.5) * 2));
    const half = Math.max(1.2, th * 0.5);
    topPts.push(`${x.toFixed(1)},${(y - half).toFixed(1)}`);
    botPts.push(`${x.toFixed(1)},${(y + half).toFixed(1)}`);
  }
  botPts.reverse();
  return `M${topPts.join('L')}L${botPts.join('L')}Z`;
}

// 🌊 垂直方向の黄金サイン波ピラー（上下テーパー対応）
function waveRibbonV(y0, y1, xMid, amp, cycles, phaseRad, thStart, thMid, thEnd, steps = 48){
  const leftPts = [], rightPts = [];
  for(let i = 0; i <= steps; i++){
    const t = i / steps;
    const y = y0 + (y1 - y0) * t;
    const ang = t * cycles * Math.PI * 2 + phaseRad;
    const x = xMid + amp * Math.sin(ang);
    const th = (t < 0.5)
      ? (thStart + (thMid - thStart) * (t * 2))
      : (thMid + (thEnd - thMid) * ((t - 0.5) * 2));
    const half = Math.max(1.2, th * 0.5);
    leftPts.push(`${(x - half).toFixed(1)},${y.toFixed(1)}`);
    rightPts.push(`${(x + half).toFixed(1)},${y.toFixed(1)}`);
  }
  rightPts.reverse();
  return `M${leftPts.join('L')}L${rightPts.join('L')}Z`;
}

// 🌊 円弧に沿って波打つ黄金リング・クレスト弧
function waveArcBand(cx, cy, rOuter, rInner, deg0, deg1, waveAmp, waveCycles, phaseRad = 0, steps = 64){
  const outPts = [], inPts = [];
  for(let i = 0; i <= steps; i++){
    const t = i / steps;
    const deg = deg0 + (deg1 - deg0) * t;
    const rad = (deg * Math.PI) / 180;
    const env = Math.sin(t * Math.PI); // 両端で滑らかに収束
    const wOff = waveAmp * env * Math.sin(t * waveCycles * Math.PI * 2 + phaseRad);
    const ro = rOuter + wOff;
    const ri = rInner + wOff * 0.65;
    outPts.push(`${(cx + Math.cos(rad) * ro).toFixed(1)},${(cy + Math.sin(rad) * ro).toFixed(1)}`);
    inPts.push(`${(cx + Math.cos(rad) * ri).toFixed(1)},${(cy + Math.sin(rad) * ri).toFixed(1)}`);
  }
  inPts.reverse();
  return `M${outPts.join('L')}L${inPts.join('L')}Z`;
}

const WAVE_LOGOS = [

      // 上部250°を包む波打ち黄金二重アーク

      // 下部を横断する5層の黄金サイン波リボン（円形内に収まるスパン）
      const w1 = waveRibbonH(95, 905, 700, 28, 2.5, 0.0, 8, 30, 8, 56);

      const guide = `<g class="guide-layer" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 5" opacity="0.82">
        <circle cx="500" cy="500" r="460"/>

      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
        <g fill="${fg}">

const ALL_LOGOS = WAVE_LOGOS.concat(GEO_LOGOS);

let curFg = '#ffffff';
let curBg = '#046e7e';
let showGuide = true;
let curCat = 'all';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(() => { t.style.display = 'none'; }, 2800);
}

function buildCardElement(item){
  const idx = ALL_LOGOS.indexOf(item);
  const card = document.createElement('article');
  card.className = 'card' + (item.cat === 'wave' ? ' wave-card' : '');
  card.innerHTML = `
    <div class="card-head">
      <h3>${item.title}</h3>
      <span class="ratio-tag">${item.ratioLabel}</span>
    </div>
    <div class="stage" style="--stage-bg:${curBg}">
      ${item.buildSvg(curFg, showGuide)}
    </div>
    <div class="card-body">
      <p class="desc">${item.desc}</p>
      <div class="math-note">📐 黄金律設計: ${item.math}</div>
      <div class="card-actions">
        <button type="button" class="btn gold use-in-app-btn" data-idx="${idx}">⚡ 手ぬぐい・ダボに配置する</button>
        <button type="button" class="btn ghost dl-svg-btn" data-idx="${idx}">📐 SVG保存</button>
        <button type="button" class="btn ghost dl-png-btn" data-idx="${idx}">🖼️ PNG保存</button>
      </div>
    </div>
  `;
  return card;
}

function renderAllCards(){
  const waveGrid = document.getElementById('waveLogoGrid');
  const geoGrid = document.getElementById('geoLogoGrid');
  waveGrid.innerHTML = '';
  geoGrid.innerHTML = '';
  WAVE_LOGOS.forEach(item => waveGrid.appendChild(buildCardElement(item)));
  GEO_LOGOS.forEach(item => geoGrid.appendChild(buildCardElement(item)));

  document.getElementById('waveSectionWrap').style.display = (curCat === 'all' || curCat === 'wave') ? 'block' : 'none';
  document.getElementById('geoSectionWrap').style.display = (curCat === 'all' || curCat === 'geo') ? 'block' : 'none';

  document.querySelectorAll('.use-in-app-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = ALL_LOGOS[+btn.dataset.idx];
      sendLogoToMainApp(item);
    });
  });
  document.querySelectorAll('.dl-svg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = ALL_LOGOS[+btn.dataset.idx];
      const svgStr = item.buildSvg(curFg, false);
      const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `nakahaneda_${item.id}.svg`;
      a.click();
      showToast(`📐 「${item.title}」のSVGを保存しました`);
    });
  });
  document.querySelectorAll('.dl-png-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = ALL_LOGOS[+btn.dataset.idx];
      const svgStr = item.buildSvg(curFg, false);
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement('canvas');
        cv.width = 1600; cv.height = 1600;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, 1600, 1600);
        cv.toBlob(blob => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `nakahaneda_${item.id}.png`;
          a.click();
          showToast(`🖼️ 「${item.title}」の高解像度PNGを保存しました`);
        }, 'image/png');
      };
      img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgStr);
    });
  });
}

function sendLogoToMainApp(item){
  const cleanSvg = item.buildSvg(curFg, false);
  const dataUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(cleanSvg);
  try{
    const shelfStorageId = 'haneda-logo-shelf-v1';
    const shelf = JSON.parse(localStorage.getItem(shelfStorageId) || '[]');
    const cleanTitle = item.title.replace(/^[①-⑫]\s*/, '');
    const prefix = item.cat === 'wave' ? '🌊 ' : '📐 ';
    const slotObj = {
      logoName: cleanTitle,
      logoDataUrl: item.token || dataUrl,
      logoRemoveBg: false,
      logoBgMode: 'none',
      logoInvert: false,
      logoMono: true,
      logoColor: curFg,
      logoOutlineMm: 0,
      logoPadMode: 'silhouette',
      logoPadColorMode: 'bg',
      logoPadColor: '#046e7e',
      logoPadMarginMm: 6,
      logoSize: 88,
      logoX: 50,
      logoY: 22,
      daboSpotPart: 'all'
    };
    const existIdx = shelf.findIndex(x => x && x.id === 'shelf_' + item.id);
    const entry = { id: 'shelf_' + item.id, name: prefix + cleanTitle, savedAt: Date.now(), slot: slotObj };
    if(existIdx >= 0) shelf[existIdx] = entry;
    else shelf.unshift(entry);
    localStorage.setItem(shelfStorageId, JSON.stringify(shelf));

    const stStorageId = 'haneda-arare-settings';
    const st = JSON.parse(localStorage.getItem(stStorageId) || '{}');
    Object.assign(st, slotObj, {
      showLogo: true,
      logoSlots: [ slotObj ],
      activeLogoSlot: 0,
      daboLogoTarget: 'all'
    });
    localStorage.setItem(stStorageId, JSON.stringify(st));
    showToast(`⚡ 「${item.title}」を手ぬぐい＆ダボに配置しました！移動します...`);
    setTimeout(() => { window.location.href = 'arare_app.html'; }, 550);
  }catch(e){
    alert('設定の保存に失敗しました: ' + e.message);
  }
}

document.querySelectorAll('#catFilterBar .cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#catFilterBar .cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curCat = btn.dataset.cat;
    renderAllCards();
  });
});

document.querySelectorAll('[data-fg]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-fg]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curFg = btn.dataset.fg;
    document.getElementById('customFgPicker').value = curFg;
    renderAllCards();
  });
});
document.getElementById('customFgPicker').addEventListener('input', e => {
  curFg = e.target.value;
  document.querySelectorAll('[data-fg]').forEach(b => b.classList.remove('active'));
  renderAllCards();
});
document.querySelectorAll('[data-bg]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curBg = btn.dataset.bg;
    renderAllCards();
  });
});
document.getElementById('toggleGuideChk').addEventListener('change', e => {
  showGuide = e.target.checked;
  document.body.classList.toggle('hide-guides', !showGuide);
  renderAllCards();
});

renderAllCards();
</script>
</body>
