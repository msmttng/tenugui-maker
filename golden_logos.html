<script>
const PHI = (1 + Math.sqrt(5)) / 2; // 1.6180339887...

// 黄金比グリッド（線幅 : 空間 = φ : 1）に基づくモダン「仲・羽・田」単体グリフパス生成
// (x0, y0) を左上とし、幅 w, 高さ h の矩形内に描画する SVG path 文字列を返す
function glyphNakaPath(x0, y0, w, h){
  const rx = (u) => (x0 + u * w).toFixed(2);
  const ry = (v) => (y0 + v * h).toFixed(2);
  const rect = (u0, v0, uw, vh) => `M${rx(u0)},${ry(v0)}H${rx(u0+uw)}V${ry(v0+vh)}H${rx(u0)}Z`;
  // 黄金比ストローク s = 0.165, ギャップ g = s / φ = 0.102
  const s = 0.162;
  let d = '';
  // 「亻」（にんべん）：上部に45°モダンベベルを持つ垂直ピラー
  d += `M${rx(0.08)},${ry(0.0)}H${rx(0.26)}V${ry(0.28)}L${rx(0.23)},${ry(0.32)}V${ry(1.0)}H${rx(0.07)}V${ry(0.36)}H${rx(0.0)}V${ry(0.20)}L${rx(0.08)},${ry(0.12)}Z`;
  // 「中」の外枠（黄金長方形プロポーション y: 0.191..0.764）
  const cx0 = 0.34, cx1 = 1.00, cy0 = 0.18, cy1 = 0.76;
  const cs = 0.145;
  // 上辺・下辺・左柱・右柱
  d += rect(cx0, cy0, cx1 - cx0, cs);
  d += rect(cx0, cy1 - cs, cx1 - cx0, cs);
  d += rect(cx0, cy0, cs, cy1 - cy0);
  d += rect(cx1 - cs, cy0, cs, cy1 - cy0);
  // 中央を貫く黄金縦軸
  const midX = (cx0 + cx1) * 0.5 - s * 0.5;
  d += rect(midX, 0.0, s, 1.0);
  return d;
}

function glyphHanePath(x0, y0, w, h){
  const rx = (u) => (x0 + u * w).toFixed(2);
  const ry = (v) => (y0 + v * h).toFixed(2);
  const rect = (u0, v0, uw, vh) => `M${rx(u0)},${ry(v0)}H${rx(u0+uw)}V${ry(v0+vh)}H${rx(u0)}Z`;
  const s = 0.158;
  let d = '';
  // 左右シンメトリー黄金ウイング（左翼 0..0.462, 右翼 0.538..1.000）
  for(const off of [0.0, 0.538]){
    const wWing = 0.462;
    // 上辺（左角をシャープに斜めカット）
    d += `M${rx(off + 0.06)},${ry(0.0)}H${rx(off + wWing)}V${ry(s)}H${rx(off)}V${ry(0.06)}Z`;
    // 右主柱（下端に黄金比の跳ね）
    d += `M${rx(off + wWing - s)},${ry(0.0)}H${rx(off + wWing)}V${ry(1.0)}H${rx(off + 0.12)}L${rx(off + 0.06)},${ry(1.0 - s)}H${rx(off + wWing - s)}Z`;
    // 内部の2本の羽根バー（黄金分割位置 0.382 と 0.618）
    d += rect(off + 0.02, 0.34, wWing - s - 0.06, s * 0.85);
    d += rect(off + 0.02, 0.60, wWing - s - 0.06, s * 0.85);
  }
  return d;
}

function glyphTaPath(x0, y0, w, h){
  const rx = (u) => (x0 + u * w).toFixed(2);
  const ry = (v) => (y0 + v * h).toFixed(2);
  const rect = (u0, v0, uw, vh) => `M${rx(u0)},${ry(v0)}H${rx(u0+uw)}V${ry(v0+vh)}H${rx(u0)}Z`;
  // 3本のストローク s = 0.184, 2つの黄金窓 g = (1 - 3s)/2 = 0.224
  const s = 0.184;
  const m = 0.5 - s * 0.5;
  let d = '';
  // 外周4辺
  d += rect(0, 0, 1, s);
  d += rect(0, 1 - s, 1, s);
  d += rect(0, 0, s, 1);
  d += rect(1 - s, 0, s, 1);
  // 中央十字
  d += rect(m, 0, s, 1);
  d += rect(0, m, 1, s);
  return d;
}

const GOLDEN_LOGOS = [
  {
    id: 'gold_1_circle',
    token: '__BUILTIN_GOLD_1__',
    title: '① 黄金円・モダン丸紋（Golden Circle Monogram）',

    desc: '外円(1000)と内円(618 = 1/φ)の二重黄金リングの中に、黄金比グリッドで設計した「仲（上段 φ⁻²）」「羽・田（下段シンメトリー）」を品字紋配置した現代的な丸紋。背紋・胸紋のどちらにも格調高く収まります。',
    math: '外径 1000 : 内径 618 (1/φ) : 核 382 (1/φ²) ／ 文字線幅 : 窓 = φ : 1',
    buildSvg(fg, showGuide){
      const pNaka = glyphNakaPath(365, 195, 270, 255);
      const pHane = glyphHanePath(215, 495, 255, 255);
      const pTa   = glyphTaPath(530, 495, 255, 255);
      const guide = `<g class="guide-layer" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="7 5" opacity="0.78">
        <circle cx="500" cy="500" r="460"/>
        <circle cx="500" cy="500" r="${(460/PHI).toFixed(1)}"/>
        <circle cx="500" cy="500" r="${(460/(PHI*PHI)).toFixed(1)}"/>
        <line x1="40" y1="472" x2="960" y2="472"/>
        <line x1="500" y1="40" x2="500" y2="960"/>
        <text x="512" y="82" fill="#fde047" font-size="22" font-family="monospace" stroke="none">R = 1.000</text>

      </g>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
        <g fill="${fg}" fill-rule="nonzero">
          <!-- 外周黄金リング (外R=460, 内R=412) + 4方向の黄金スリット -->
          <path fill-rule="evenodd" d="M500,40 A460,460 0 1,1 499.9,40 Z M500,88 A412,412 0 1,0 500.1,88 Z"/>
          <!-- 内側ファインリング (外R=392, 内R=380) -->
          <path fill-rule="evenodd" d="M500,108 A392,392 0 1,1 499.9,108 Z M500,120 A380,380 0 1,0 500.1,120 Z"/>
          <!-- 黄金分割ホリゾンタルブリッジ -->
          <rect x="215" y="466" width="570" height="12"/>
          <rect x="494" y="472" width="12" height="295"/>
          <!-- 仲・羽・田 モダン角字 -->
          <path d="${pNaka}"/>
          <path d="${pHane}"/>

    }
  },
  {
    id: 'gold_2_monolith',
    token: '__BUILTIN_GOLD_2__',
    title: '② 黄金長方形・ネオ角字モノリス（Golden Monolith 1:φ）',
    ratioLabel: 'W : H = 1 : φ (618 : 1000)',
    desc: '外形そのものが厳密な黄金長方形（618×1000）で構成された現代建築風モノリスロゴ。四隅を黄金比（1/φ⁴）で45°面取りした二重フレーム内に「仲・羽・田」を縦一列でシンメトリー配置しています。',
    math: '外枠 560 × 906 (1 : 1.618) ／ 面取り 55px (フィボナッチ数) ／ 3文字等ピッチ黄金配置',
    buildSvg(fg, showGuide){
      // 外枠 560 x 906 (560 * 1.618034 = 906.1), 左上 (220, 47)
      const pNaka = glyphNakaPath(390, 128, 220, 212);
      const pHane = glyphHanePath(390, 394, 220, 212);
      const pTa   = glyphTaPath(390, 660, 220, 212);
      const oct = (x, y, w, h, c) => `M${x+c},${y}H${x+w-c}L${x+w},${y+c}V${y+h-c}L${x+w-c},${y+h}H${x+c}L${x},${y+h-c}V${y+c}Z`;
      const outerOct = oct(220, 47, 560, 906, 55);
      const innerOct = oct(254, 81, 492, 838, 42);
      const thinOct1 = oct(270, 97, 460, 806, 34);
      const thinOct2 = oct(280, 107, 440, 786, 30);
      const guide = `<g class="guide-layer" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="7 5" opacity="0.78">
        <rect x="220" y="47" width="560" height="906"/>

        <text x="232" y="38" fill="#fde047" font-size="22" font-family="monospace" stroke="none">W=1.000 : H=φ(1.618)</text>
      </g>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
        <g fill="${fg}">
          <path fill-rule="evenodd" d="${outerOct} ${innerOct}"/>

          <!-- 黄金比セパレーターバー -->
          <rect x="330" y="361" width="340" height="10"/>
          <rect x="330" y="627" width="340" height="10"/>
          <!-- 左右の縦アクセントピラー -->
          <rect x="330" y="128" width="14" height="744"/>
          <rect x="656" y="128" width="14" height="744"/>
          <path d="${pNaka}"/>

        </g>
        ${showGuide ? guide : ''}
      </svg>`;
    }
  },
  {
    id: 'gold_3_wings',
    token: '__BUILTIN_GOLD_3__',
    title: '③ 黄金螺旋・飛翔ウイング紋（Golden Wing Crest）',
    ratioLabel: 'Fibonacci Arcs: 89 : 144 : 233 : 377',
    desc: '「仲羽田」の「羽（HANE）」を象徴する左右一対の飛翔ウイングをフィボナッチ黄金円弧（89, 144, 233, 377）で構成し、中央の黄金コアに「仲・羽・田」を収めたダイナミックなエンブレム。ダボシャツの背紋や胸に圧倒的な存在感を放ちます。',
    math: '翼スパン 920 : 中央盾 354 (1/φ²) ／ 3枚の黄金フェザーブレード角度 φ比率',
    buildSvg(fg, showGuide){
      const pNaka = glyphNakaPath(412, 230, 176, 165);

      const pTa   = glyphTaPath(412, 610, 176, 165);
      // 左ウイング 3枚の黄金フェザーブレード (右ウイングは x=1000-x で完全対称)
      const wingBlade = (pts) => {
        const L = 'M' + pts.map(p => `${p[0]},${p[1]}`).join('L') + 'Z';
        const R = 'M' + pts.map(p => `${1000 - p[0]},${p[1]}`).join('L') + 'Z';
        return L + ' ' + R;
      };
      const blades = [
        // 第1翼（上段メインブレード：長さ377）
        wingBlade([[330, 310], [45, 195], [75, 275], [330, 378]]),
        // 第2翼（中段ブレード：長さ288）

        // 第3翼（下段ブレード：長さ210）

        wingBlade([[345, 604], [225, 562], [248, 618], [360, 658]])
      ].join(' ');
      // 中央の黄金六角シールド
      const shieldOuter = `M500,135 L655,210 L655,775 L500,865 L345,775 L345,210 Z`;
      const shieldInner = `M500,165 L629,228 L629,757 L500,833 L371,757 L371,228 Z`;
      const guide = `<g class="guide-layer" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="7 5" opacity="0.78">
        <circle cx="500" cy="500" r="377"/>
        <circle cx="500" cy="500" r="233"/>
        <circle cx="500" cy="500" r="144"/>
        <line x1="45" y1="500" x2="955" y2="500"/>
        <text x="510" y="115" fill="#fde047" font-size="22" font-family="monospace" stroke="none">Fibonacci R = 377 / 233 / 144</text>

      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
        <g fill="${fg}">
          <path d="${blades}"/>

    }
  },
  {
    id: 'gold_4_fuda',
    token: '__BUILTIN_GOLD_4__',
    title: '④ 黄金六角・モダン千社札（Golden Modern Senjafuda）',
    ratioLabel: 'Crown 1/φ³ : Body 1/φ : Base 1/φ⁴',
    desc: '伝統の木札・千社札を黄金比でモダンに再設計したネオ千社札。上部の山形角度・組紐ホール・二重枠の余白すべてが φ 比率で統一され、下部の黄金セクションには「SEINENKAI」の幾何学レタリングまたは格子紋が収まります。',
    math: '札高 900 : 札幅 440 ／ 頂角高 131 (1/φ⁴) ／ 内枠余白 21 : 34 (フィボナッチ比)',
    buildSvg(fg, showGuide){
      const pNaka = glyphNakaPath(395, 255, 210, 185);

let curFg = '#ffffff';
let curBg = '#046e7e';
let showGuide = true;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(() => { t.style.display = 'none'; }, 2800);
}

function renderAllCards(){
  const grid = document.getElementById('logoGrid');
  grid.innerHTML = '';
  GOLDEN_LOGOS.forEach((item, idx) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <h2>${item.title}</h2>
        <span class="ratio-tag">${item.ratioLabel}</span>
      </div>
      <div class="stage" style="--stage-bg:${curBg}">
        ${item.buildSvg(curFg, showGuide)}
      </div>
      <div class="card-body">
        <p class="desc">${item.desc}</p>
        <div class="math-note">📐 黄金律設計: ${item.math}</div>
        <div class="card-actions">
          <button type="button" class="btn gold use-in-app-btn" data-idx="${idx}">⚡ 手ぬぐい・ダボに配置する</button>
          <button type="button" class="btn ghost dl-svg-btn" data-idx="${idx}">📐 SVG保存</button>
          <button type="button" class="btn ghost dl-png-btn" data-idx="${idx}">🖼️ PNG保存</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  document.querySelectorAll('.use-in-app-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = GOLDEN_LOGOS[+btn.dataset.idx];
      sendLogoToMainApp(item);
    });
  });
  document.querySelectorAll('.dl-svg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = GOLDEN_LOGOS[+btn.dataset.idx];
      const svgStr = item.buildSvg(curFg, false);
      const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `nakahaneda_${item.id}.svg`;
      a.click();
      showToast(`📐 「${item.title}」のSVGを保存しました`);
    });
  });
  document.querySelectorAll('.dl-png-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = GOLDEN_LOGOS[+btn.dataset.idx];
      const svgStr = item.buildSvg(curFg, false);
      const img = new Image();
      img.onload = () => {
        const cv = document.createElement('canvas');
        cv.width = 1600; cv.height = 1600;
        const ctx = cv.getContext('2d');
        ctx.drawImage(img, 0, 0, 1600, 1600);
        cv.toBlob(blob => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = `nakahaneda_${item.id}.png`;
          a.click();
          showToast(`🖼️ 「${item.title}」の高解像度PNGを保存しました`);
        }, 'image/png');
      };
      img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgStr);
    });
  });
}

function sendLogoToMainApp(item){
  const cleanSvg = item.buildSvg(curFg, false);
  const dataUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(cleanSvg);
  try{
    // 1. マイ・ロゴ保管棚 (haneda-logo-shelf-v1) に追加・更新
    const shelfStorageId = 'haneda-logo-shelf-v1';
    const shelf = JSON.parse(localStorage.getItem(shelfStorageId) || '[]');
    const cleanTitle = item.title.replace(/^[①-⑥]\s*/, '');
    const slotObj = {
      logoName: cleanTitle,
      logoDataUrl: dataUrl,
      logoRemoveBg: false,
      logoBgMode: 'none',
      logoInvert: false,
      logoMono: false,
      logoColor: curFg,
      logoOutlineMm: 0,
      logoPadMode: 'silhouette',
      logoPadColorMode: 'bg',
      logoPadColor: '#046e7e',
      logoPadMarginMm: 6,
      logoSize: 88,
      logoX: 50,
      logoY: 22,
      daboSpotPart: 'all'
    };
    const existIdx = shelf.findIndex(x => x && x.id === 'shelf_' + item.id);
    const entry = { id: 'shelf_' + item.id, name: '📐 ' + cleanTitle, savedAt: Date.now(), slot: slotObj };
    if(existIdx >= 0) shelf[existIdx] = entry;
    else shelf.unshift(entry);
    localStorage.setItem(shelfStorageId, JSON.stringify(shelf));

    // 2. 現在のアプリ設定 (haneda-arare-settings) にアクティブ配置して手ぬぐい・ダボ画面を開く
    const stStorageId = 'haneda-arare-settings';
    const st = JSON.parse(localStorage.getItem(stStorageId) || '{}');
    Object.assign(st, slotObj, {
      showLogo: true,
      logoSlots: [ slotObj ],
      activeLogoSlot: 0,
      daboLogoTarget: 'all'
    });
    localStorage.setItem(stStorageId, JSON.stringify(st));
    showToast(`⚡ 「${item.title}」を手ぬぐい＆ダボに配置しました！移動します...`);
    setTimeout(() => { window.location.href = 'arare_app.html'; }, 550);
  }catch(e){
    alert('設定の保存に失敗しました: ' + e.message);
  }
}

document.querySelectorAll('[data-fg]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-fg]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curFg = btn.dataset.fg;
    document.getElementById('customFgPicker').value = curFg;
    renderAllCards();
  });
});
document.getElementById('customFgPicker').addEventListener('input', e => {
  curFg = e.target.value;
  renderAllCards();
});
document.querySelectorAll('[data-bg]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-bg]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    curBg = btn.dataset.bg;
    renderAllCards();
  });
});
document.getElementById('toggleGuideChk').addEventListener('change', e => {
  showGuide = e.target.checked;
  document.body.classList.toggle('hide-guides', !showGuide);
  renderAllCards();
});

renderAllCards();
</script>
</body>
